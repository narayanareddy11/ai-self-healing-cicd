name: ci

on:
  push:
    branches:
      - main
      - "ai-remediation/**"
  pull_request:
    branches:
      - main

jobs:
  python:
    name: python-quality
    runs-on: [self-hosted, local-mac]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -e ".[security]"

      - name: Lint
        run: .venv-ci/bin/python -m ruff check services ai_platform tests scripts

      - name: Unit tests
        run: .venv-ci/bin/python -m pytest

      - name: Security scan
        run: .venv-ci/bin/python -m bandit -r services ai_platform scripts -x "services/user-service/tests,services/product-service/tests,services/order-service/tests,tests"

  docker:
    name: docker-build-and-scan
    runs-on: [self-hosted, local-mac]
    needs: python
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user-service
            image: ai-user-service
          - name: product-service
            image: ai-product-service
          - name: order-service
            image: ai-order-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service.image }}:${{ github.sha }} services/${{ matrix.service.name }}

      - name: Container image security scan
        run: trivy image --format table --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed ${{ matrix.service.image }}:${{ github.sha }}

  kubernetes:
    name: kubernetes-deploy
    runs-on: [self-hosted, local-mac]
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install PyYAML
          .venv-ci/bin/python scripts/validate-kubernetes-manifests.py

      - name: Deploy to local Kubernetes
        run: |
          kubectl config use-context docker-desktop
          kubectl apply -f kubernetes/user-service
          kubectl apply -f kubernetes/product-service
          kubectl apply -f kubernetes/order-service

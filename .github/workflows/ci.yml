name: ci

on:
  push:
    branches:
      - main
      - "ai-remediation/**"
  pull_request:
    branches:
      - main

jobs:
  python:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"

      - name: Lint
        run: python -m ruff check services ai_platform tests scripts

      - name: Unit tests
        run: python -m pytest

      - name: Security scan
        run: python -m bandit -r services ai_platform scripts -x "services/user-service/tests,services/product-service/tests,services/order-service/tests,tests"

  docker:
    name: docker-build-and-scan
    runs-on: ubuntu-latest
    needs: python
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user-service
            image: ai-user-service
          - name: product-service
            image: ai-product-service
          - name: order-service
            image: ai-order-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service.image }}:${{ github.sha }} services/${{ matrix.service.name }}

      - name: Container image security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  kubernetes:
    name: kubernetes-validation
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Kubernetes manifests
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
          python scripts/validate-kubernetes-manifests.py

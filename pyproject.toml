[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-self-healing-cicd"
version = "0.1.0"
description = "AI-assisted self-healing CI/CD platform proof of concept"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
security = [
    "bandit>=1.7.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["ai_platform*"]
exclude = ["services*", "kubernetes*", "knowledge*", "artifacts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
